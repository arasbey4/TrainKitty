[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "trainkit"
version = "0.1.0"
description = "Describe it. Train it. Run it. — Local-first AI model creation and training platform powered by Ollama."
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "TrainKit contributors" }]
dependencies = [
    "fastapi>=0.115,<1.0",
    "uvicorn>=0.30,<1.0",
    "sqlalchemy>=2.0,<3.0",
    "httpx>=0.27,<1.0",
    "psutil>=5.9,<8.0",
    "python-multipart>=0.0.9",
]

[project.optional-dependencies]
# Real training engine. CPU-only PyTorch can be installed with:
#   pip install torch --index-url https://download.pytorch.org/whl/cpu
training = [
    "torch>=2.2",
    "transformers>=4.41",
    "peft>=0.11",
    "accelerate>=0.30",
    "safetensors>=0.4",
]
hf = ["datasets>=2.19"]
dev = ["pytest>=7.4"]
gguf = ["gguf>=0.6"]

[tool.setuptools.packages.find]
where = ["backend"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 110
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B"]
ignore = ["E501", "B008"]
